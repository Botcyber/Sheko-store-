<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title> التصويت - VIBE </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />

  <style>
    body { font-family: 'Cairo', sans-serif; margin: 0; background: #f1f1f1; }
    .top-bar { background: #222; padding: 10px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
    .user-area button { background: #ffb700; color: #222; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    @keyframes glowTitle {
      0% { text-shadow: 0 0 6px #ffb700; }
      50% { text-shadow: 0 0 18px #ffd966; }
      100% { text-shadow: 0 0 6px #ffb700; }
    }
    .vote-container { max-width: 1000px; margin: 30px auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    
    /* كارت التصويت مع إضافة شارة المركز */
    .vote-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,.08); text-align: center; padding-bottom: 20px; transition: transform 0.3s ease; position: relative; }
    .vote-card:hover { transform: translateY(-5px); }
    
    /* شارة الترتيب */
    .rank-badge { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.75); color: #ffb700; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; border: 1px solid #ffb700; z-index: 10; }
    .rank-first { background: #ffb700 !important; color: #222 !important; font-size: 16px; box-shadow: 0 0 10px rgba(255,183,0,0.5); }

    .candidate-img { width: 100%; height: 260px; object-fit: cover; background: #e0e0e0; }
    .candidate-name { font-size: 22px; font-weight: 800; padding: 15px 15px 5px; color: #222; }
    .vote-count { font-size: 26px; color: #ffb700; font-weight: bold; margin: 10px 0 15px; }
    .vote-btn { background: #222; color: white; border: none; padding: 12px 35px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .vote-btn:hover { background: #ffb700; color: #222; }
    
    .closed-msg { display: none; text-align: center; max-width: 600px; margin: 80px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .closed-msg i { font-size: 60px; color: #ffb700; margin-bottom: 15px; }
    .closed-msg h2 { font-size: 28px; color: #222; margin: 10px 0; }
    .closed-msg p { font-size: 18px; color: #666; }
  </style>
</head>
<body>

<div class="top-bar">
  <div style="font-size:24px; font-weight:bold; color:#ffcc33; animation:glowTitle 2s infinite ease-in-out;">
    VIBE STUDIO - منصة التصويت
  </div>
  <div class="user-area">
    <span id="userEmail" style="margin-left: 10px; font-size: 14px;"></span>
    <button onclick="logout()">خروج <i class="fa fa-sign-out-alt"></i></button>
  </div>
</div>

<div class="closed-msg" id="closedMessage">
  <i class="fa fa-clock"></i>
  <h2>تم الانتهاء من فترة التصويت</h2>
  <p>ترقبو القادم...</p>
</div>

<div class="vote-container" id="voteBox">
  <!-- تظهر كروت المتسابقين هنا مرتبة تلقائياً -->
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAYcZ2_RjaI4fjP14QlqbUbL3rWvPPWnas",
  authDomain: "sheko-store.firebaseapp.com",
  databaseURL: "https://sheko-store-default-rtdb.firebaseio.com",
  projectId: "sheko-store",
  storageBucket: "sheko-store.appspot.com",
  messagingSenderId: "113892775847",
  appId: "1:113892775847:web:2aa4c11c3f5dd1d15f0882"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;

auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.replace("index.html");
  } else {
    currentUser = user;
    document.getElementById("userEmail").textContent = user.email;
  }
});

function logout() {
  auth.signOut().then(() => {
    window.location.replace("index.html");
  }).catch(() => {
    window.location.href = "index.html";
  });
}

// جلب البيانات وترتيبها تلقائياً وسريعاً
db.ref().on("value", mainSnapshot => {
  const settings = mainSnapshot.child("vibe_settings").val() || { status: "open" };
  const candidatesData = mainSnapshot.child("vibe_voting");
  
  const voteBox = document.getElementById("voteBox");
  const closedMessage = document.getElementById("closedMessage");

  if (settings.status === "closed") {
    voteBox.style.display = "none";
    closedMessage.style.display = "block";
    return;
  } else {
    voteBox.style.display = "grid";
    closedMessage.style.display = "none";
  }

  voteBox.innerHTML = ""; 
  
  if(!candidatesData.exists()){
    voteBox.innerHTML = "<div style='grid-column: 1/-1; text-align:center; font-size:18px; color:#666;'>لا توجد خيارات تصويت متاحة حالياً.</div>";
    return;
  }

  // تحويل البيانات إلى مصفوفة (Array) لتسهيل ترتيبها وسرعة معالجتها
  let candidatesList = [];
  candidatesData.forEach(childSnapshot => {
    candidatesList.push({
      id: childSnapshot.key,
      name: childSnapshot.val().name,
      image: childSnapshot.val().image,
      votes: childSnapshot.val().votes || 0
    });
  });

  // ترتيب القائمة: الأصوات الأكثر أولاً (ترتيب تنازلي)
  candidatesList.sort((a, b) => b.votes - a.votes);

  // عرض كروت المتسابقين بعد الترتيب
  candidatesList.forEach((candidate, index) => {
    const position = index + 1; // الترتيب يبدأ من 1
    
    // تمييز المركز الأول بشارة ذهبية
    const badgeClass = position === 1 ? "rank-badge rank-first" : "rank-badge";
    const badgeText = position === 1 ? "🏆 المركز الأول" : `المركز ${position}`;

    const card = document.createElement("div");
    card.className = "vote-card";
    card.innerHTML = `
      <div class="${badgeClass}">${badgeText}</div>
      <img src="${candidate.image || 'https://via.placeholder.com/250'}" class="candidate-img" loading="lazy">
      <div class="candidate-name">${candidate.name}</div>
      <div class="vote-count">🔥 <span>${candidate.votes}</span> صوت</div>
      <button class="vote-btn" onclick="castVote('${candidate.id}')">تـصـويـت <i class="fa fa-thumbs-up"></i></button>
    `;
    voteBox.appendChild(card);
  });
});

function castVote(id) {
  if(!currentUser) return alert("يجب تسجيل الدخول أولاً!");

  const userId = currentUser.uid;
  const userVoteRef = db.ref(`vibe_votes_logs/${userId}`);

  userVoteRef.once("value", snapshot => {
    if(snapshot.exists()) {
      alert("عذراً، لقد قمت بالتصويت بالفعل مسبقاً!");
    } else {
      userVoteRef.set({
        votedFor: id,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        db.ref(`vibe_voting/${id}/votes`).transaction(currentVotes => (currentVotes || 0) + 1);
        alert("تم تسجيل صوتك بنجاح!");
      });
    }
  });
}
</script>
</body>
</html>
